name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify signers.yaml commit signature
        run: |
          # Check if the last commit touching signers.yaml is signed
          last_commit=$(git log --format=%H -1 -- signers.yaml)
          if [ -z "$last_commit" ]; then
            echo "No commits found for signers.yaml; skipping signature check"
            exit 0
          fi

          signature=$(git log --format=%B "$last_commit" | grep -i "gpgsig\|ssh")
          if [ -z "$signature" ]; then
            echo "WARNING: Last commit to signers.yaml is not GPG/SSH signed"
            echo "Commit: $last_commit"
            echo "For production, this should trigger a hard failure."
            exit 0
          fi
          echo "INFO: signers.yaml commit is signed"

      - uses: Rethunk-Tech/gh-actions/setup-python@68f159b435d9b129b8baf36436079c3e76fb3222 # v1.11
        with:
          python-version: ${{ matrix.python-version }}
          install-args: --locked

      - name: Compile Python
        run: uv run python -m compileall src tests

      - name: Run tests
        run: PYTHONPATH=src uv run python -m unittest discover -s tests

      - name: Validate submissions
        run: PYTHONPATH=src uv run python -m bakeoff_results.validate --scan --allow-empty submissions

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sigstore bundle verification
        run: |
          # Hard gate: any submitted signature.sigstore.json must verify against
          # the trusted signing identity (repo:Rethunk-AI/bakeoff:ref:refs/heads/main
          # via .github/workflows/package-results.yml, per signers.yaml). Vacuously
          # passes when no submissions carry a bundle yet — nothing to break.
          failed=0
          found=0
          while IFS= read -r bundle; do
            found=$((found + 1))
            bundle_dir="$(dirname "$bundle")"
            # The manifest names which file the signature covers; upstream
            # signs result.json, so verifying manifest.json would always fail.
            signed_file="$bundle_dir/$(jq -r '.signature.signed_file // "result.json"' "$bundle_dir/manifest.json" 2>/dev/null || echo result.json)"
            echo ""
            echo "Bundle: $bundle"
            if [ ! -f "$signed_file" ]; then
              echo "  FAIL: expected signed file not found at $signed_file"
              failed=1
              continue
            fi
            echo "  Signed file: $signed_file"
            if cosign verify-blob \
              --bundle "$bundle" \
              --certificate-identity "repo:Rethunk-AI/bakeoff:ref:refs/heads/main" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$signed_file"; then
              echo "  RESULT: PASS"
            else
              echo "  RESULT: FAIL"
              failed=1
            fi
          done < <(find submissions -name "signature.sigstore.json")

          if [ "$found" -eq 0 ]; then
            echo "No signature.sigstore.json files found in submissions/ — nothing to verify."
          else
            echo "$found bundle(s) examined."
          fi

          if [ "$failed" -eq 1 ]; then
            echo "Sigstore verification failed for one or more bundles."
            exit 1
          fi

      - name: Build static index
        run: PYTHONPATH=src uv run python -m bakeoff_results.build_index --submissions submissions --site site

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      pages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify signers.yaml commit signature
        run: |
          # Check if the last commit touching signers.yaml is signed
          last_commit=$(git log --format=%H -1 -- signers.yaml)
          if [ -z "$last_commit" ]; then
            echo "No commits found for signers.yaml; skipping signature check"
            exit 0
          fi

          signature=$(git log --format=%B "$last_commit" | grep -i "gpgsig\|ssh")
          if [ -z "$signature" ]; then
            echo "WARNING: Last commit to signers.yaml is not GPG/SSH signed"
            echo "Commit: $last_commit"
            echo "For production, this should trigger a hard failure."
            exit 0
          fi
          echo "INFO: signers.yaml commit is signed"

      - uses: Rethunk-Tech/gh-actions/setup-python@68f159b435d9b129b8baf36436079c3e76fb3222 # v1.11
        with:
          python-version: "3.14"
          install-args: --locked

      - name: Validate submissions
        run: PYTHONPATH=src uv run python -m bakeoff_results.validate --scan --allow-empty submissions

      - name: Build static index
        run: PYTHONPATH=src uv run python -m bakeoff_results.build_index --submissions submissions --site site

      - name: Attest site artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            site/index.json
            site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
