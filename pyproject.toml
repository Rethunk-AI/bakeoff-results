[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bakeoff-results"
version = "0.1.0"
description = "Validation and static index tooling for private bakeoff result bundles."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["cryptography>=43.0"]

[project.scripts]
bakeoff-results-validate = "bakeoff_results.validate:main"
bakeoff-results-build-index = "bakeoff_results.build_index:main"
bakeoff-results-queue = "bakeoff_results.queue_server:main"

[tool.setuptools.packages.find]
where = ["src"]

# Pin dev tools explicitly so local checks match CI regardless of ambient installs.
[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5", "pyrefly>=0.1", "deptry"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src"]
# python-pyproject-00008
check-unannotated-defs = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# python-pyproject-00004
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "S"]
# python-pyproject-00005: the one rule the formatter owns; a project adds only by-design rules,
# each with a comment saying why
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# HTTP handler methods are named do_GET/do_POST by BaseHTTPRequestHandler
"src/bakeoff_results/queue_server.py" = ["N802"]
# git argv is a fixed local tool invocation; the HTML f-string is not SQL
"src/bakeoff_results/build_index.py" = ["S603", "S607", "S608"]
# git argv is a fixed local tool invocation, not untrusted input
"src/bakeoff_results/signers_commit.py" = ["S603", "S607"]
# pytest asserts; fixture tokens and /tmp path-injection cases; local urlopen and git in tests
"tests/*.py" = ["S101", "S106", "S108", "S310", "S603", "S607"]

[tool.deptry]
known_first_party = ["bakeoff_results"]
