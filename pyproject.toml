[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bakeoff-results"
version = "0.1.0"
description = "Validation and static index tooling for private bakeoff result bundles."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
bakeoff-results-validate = "bakeoff_results.validate:main"
bakeoff-results-build-index = "bakeoff_results.build_index:main"

[tool.setuptools.packages.find]
where = ["src"]

# Pin dev tools explicitly so local checks match CI regardless of ambient installs.
[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5", "pyrefly>=0.1", "deptry>=0.20"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.deptry]
known_first_party = ["bakeoff_results"]
